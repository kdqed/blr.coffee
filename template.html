<!DOCTYPE html>
<html>
  <head>
    <title>{{ title or 'blr.coffee' }}</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="{{meta_description or 'A blog about coffee and other nice things in Bengaluru'}}">
    
    <link rel="shortcut icon" type="image/png" href="/assets/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">    
    <style>
    
      :root {
        --f1: #35241a;
        --b1: #f1e7e1;
        
        --font1: "Inter";
        --font2: "Indie Flower";
        
        --base-size: clamp(16px, 1.6vw, 32px);
        --max-width: calc(40 * var(--base-size));
        font-size: var(--base-size);
        line-height: 200%;
      }
      
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: var(--font1), sans-serif;
        font-weight: 400;
      }
      
      a {
        color: inherit;
      }
      
      b, strong {
        font-weight: 700;
      }
      
      body {
        background: var(--b1);
        color: var(--f1);
        text-align: center;
      }
      
      header {
        padding: 0.5rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.4rem;
        
        * {
          font-family: var(--font2);
        }
        
        .logo-link {
          display: inline-flex;
          gap: 0.75rem;
          color: inherit;
          align-items: center;
        }
        
        .logo-img {
          height: 2.5rem;
          width: auto;
        }
        
        a {
          text-decoration: none;
          font-weight: bold;
        }
        
        a.main {
          display: inline-block;
          font-size: 1rem;
          padding: 0.25rem 1rem;
          background: var(--f1);
          color: var(--b1);
          border-radius: 0.2rem;
        }
      }
      
      main {
        text-align: left;
        display: inline-flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 100vh;
        padding: 1rem;
      }
      
      h1 {
        font-size: 1.4rem;
        font-family: var(--font2);
        padding-bottom: 1rem;
        font-weight: 700;
      }
      
      h2 {
        font-size: 1.2rem;
        padding-top: 0.5rem;
        font-family: var(--font2);
      }
      
      ul {
        list-style-position: inside;
      }
      
      .publish-meta * {
        font-family: var(--font2);
        font-size: 1.2rem;
      }
      
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="logo-link">
        <img src="/assets/logo.png" class="logo-img">
        <b>blr.coffee</b>
      </a>
      <nav>
        <a href="" class="main">Subscribe</a>
      </nav>
    </header>
    <main>
      <p class="publish-meta">
        <span>{{date}}</span> / <a href="{{author_link}}">{{author}}</a>
      </p>
      {{ content | safe }}
    </main>
  </body>
</html>
