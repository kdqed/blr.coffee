<!DOCTYPE html>
<html>
  <head>
    <title>{{ title or 'blr.coffee' }}</title>
    
    <link rel="shortcut icon" type="image/png" href="/assets/favicon.png">
    
    <style>
    
      :root {
        --f1: #35241a;
        --b1: #f1e7e1;
      }
      
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      
      body {
        background: var(--b1);
        color: var(--f1);
        text-align: center;
      }
      
      header {
        padding: 0.5rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        
        .logo-link {
          display: inline-flex;
          gap: 0.75rem;
          color: inherit;
          align-items: center;
        }
        
        .logo-img {
          height: 2.5rem;
          width: auto;
        }
        
        a {
          text-decoration: none;
          font-weight: bold;
        }
        
        a.main {
          display: inline-block;
          font-size: 0.8rem;
          padding: 0.5rem 1rem;
          background: var(--f1);
          color: var(--b1);
        }
      }
      
      main {
        text-align: left;
        display: inline-flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 100vh;
        padding: 1rem;
      }
      
      h2 {
        padding-top: 0.5rem;
      }
      
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="logo-link">
        <img src="/assets/logo.png" class="logo-img">
        <b>blr.coffee</b>
      </a>
      <nav>
        <a href="" class="main">Subscribe</a>
      </nav>
    </header>
    <main>
      <p>{{date}}</p>
      {{ content | safe }}
    </main>
  </body>
</html>
